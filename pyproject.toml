[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glimpse"
version = "0.1.0"
description = "One-command lecture pipeline: video/audio -> audited Obsidian note"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
glimpse = "glimpse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100